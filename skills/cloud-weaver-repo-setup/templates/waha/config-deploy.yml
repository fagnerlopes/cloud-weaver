# Generated by CloudWeaver — base Kamal configuration for WAHA.

service: <%= ENV['REPO_NAME'] %>
image: <%= ENV['REPO_FULL'] %>

proxy:
  app_port: 3000
  ssl: true
  forward_headers: false
  healthcheck:
    path: /api/health
    interval: 5
    timeout: 10

ssh:
  user: root

registry:
  server: ghcr.io
  username: <%= ENV['REPO_OWNER'] %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  cache:
    type: gha
    options: mode=max,ignore-error=true

accessories:
  pg:
    image: supabase/postgres:15.8.1.060
    host: <%= ENV['INFRA_PG_IP'] %>
    port: 5432
    env:
      clear:
        POSTGRES_DB: waha
        POSTGRES_USER: waha
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /data/preview/pgdata:/var/lib/postgresql/data

logging:
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

readiness_delay: 30
deploy_timeout: 300
drain_timeout: 30

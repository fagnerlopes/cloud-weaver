# Generated by CloudWeaver. Provisions a VM on Locaweb Cloud and deploys
# the Hermes Agent (Telegram + LLM) using Kamal.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [".claude/**"]

permissions:
  contents: read
  packages: write

jobs:
  infra:
    uses: locaweb/locaweb-cloud-provision/.github/workflows/provision.yml@v1
    with:
      env_name: "preview"
      zone: "@[ZONE]"
      web_plan: "@[WEB_PLAN]"
      web_disk_size_gb: 20
    secrets:
      CLOUDSTACK_API_KEY: ${{ secrets.LOCAWEB_API_KEY }}
      CLOUDSTACK_SECRET_KEY: ${{ secrets.LOCAWEB_API_SECRET }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy:
    needs: infra
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Load infrastructure environment
        run: echo "${{ needs.infra.outputs.infra_env }}" >> "$GITHUB_ENV"

      - name: Set repo identity
        run: |
          echo "REPO_NAME=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "REPO_FULL=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # cloud-init on a fresh VM may take 60-90s to inject the SSH key pair.
      # Poll until key-auth works (up to 5 minutes) before handing off to Kamal.
      - name: Wait for SSH key auth
        run: |
          echo "=== SSH agent keys ==="
          ssh-add -l || echo "(no keys in agent)"

          echo "=== Tentando SSH verbose na primeira tentativa para diagnóstico ==="
          ssh -v -o StrictHostKeyChecking=no -o BatchMode=yes \
              -o ConnectTimeout=5 -o IdentitiesOnly=yes \
              ubuntu@"$INFRA_WEB_IP" echo ok 2>&1 | head -60 || true

          echo "=== Loop de espera ==="
          SSH_USER=""
          for i in $(seq 1 30); do
            for user in ubuntu root; do
              if ssh -o StrictHostKeyChecking=no \
                     -o BatchMode=yes \
                     -o ConnectTimeout=5 \
                     -o IdentitiesOnly=yes \
                     "${user}@${INFRA_WEB_IP}" echo ok 2>/dev/null; then
                echo "SSH pronto como '${user}' (tentativa $i)"
                SSH_USER="$user"
                echo "SSH_USER=${user}" >> "$GITHUB_ENV"
                break 2
              fi
            done
            echo "Tentativa $i/30: SSH ainda não pronto, aguardando 10s..."
            sleep 10
          done

          if [ -z "$SSH_USER" ]; then
            echo "=== Diagnóstico final (verbose) ==="
            ssh -v -o StrictHostKeyChecking=no -o BatchMode=yes \
                -o ConnectTimeout=5 -o IdentitiesOnly=yes \
                ubuntu@"$INFRA_WEB_IP" echo ok 2>&1 | head -60 || true
            echo "Timeout aguardando SSH" >&2
            exit 1
          fi

      - uses: crazy-max/ghaction-github-runtime@v3

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - run: gem install kamal --no-document

      - name: Deploy with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kamal proxy boot -d preview || kamal proxy reboot -y -d preview || true
          kamal setup -d preview

      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.REPO_NAME }}
          package-type: container
          min-versions-to-keep: 1

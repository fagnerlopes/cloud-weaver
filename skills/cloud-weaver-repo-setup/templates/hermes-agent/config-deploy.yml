# Generated by CloudWeaver — base Kamal configuration (all environments).
# Do not edit service/image/registry/builder blocks — they are set by the
# deployment pipeline.

service: <%= ENV['REPO_NAME'] %>
image: <%= ENV['REPO_FULL'] %>

proxy:
  app_port: 7681      # ttyd web terminal port
  ssl: true
  forward_headers: false
  healthcheck:
    path: /
    interval: 5
    timeout: 10

ssh:
  user: ubuntu

registry:
  server: ghcr.io
  username: <%= ENV['REPO_OWNER'] %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  cache:
    type: gha
    options: mode=max,ignore-error=true

logging:
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

readiness_delay: 30
deploy_timeout: 300
drain_timeout: 30

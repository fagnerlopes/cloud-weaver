# Builds and publishes pre-built recipe images to ghcr.io/fagnerlopes.
# Run manually or on changes to recipes/. Images are public (no auth required
# for participants to pull them).

name: Build Recipe Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "recipes/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - name: hermes-agent
            context: recipes/hermes-agent
          - name: waha
            context: recipes/waha

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The participant templates pin this version tag, so every recipe image
      # must carry it. Sourced from plugin.json, the single source of truth.
      - name: Read plugin version
        id: version
        run: echo "version=$(jq -r .version .claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.recipe.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.recipe.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/fagnerlopes/cw-${{ matrix.recipe.name }}:latest
            ghcr.io/fagnerlopes/cw-${{ matrix.recipe.name }}:${{ steps.version.outputs.version }}
            ghcr.io/fagnerlopes/cw-${{ matrix.recipe.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


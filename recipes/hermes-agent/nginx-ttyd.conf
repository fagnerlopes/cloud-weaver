# CloudWeaver — basic-auth gate in front of the ttyd web terminal.
# Plays the role of the Traefik `hermes-auth` middleware from the VPS recipe.
#
# The credentials file is written at container start by cw-entrypoint.sh from
# the TTYD_PASSWORD secret.

server {
    listen 7681 default_server;
    server_name _;

    # Unauthenticated liveness probe. kamal-proxy polls this path; everything
    # else sits behind basic auth.
    location = /cw-health {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        auth_basic           "CloudWeaver";
        auth_basic_user_file /etc/nginx/cw.htpasswd;

        proxy_pass http://127.0.0.1:7682;
        proxy_http_version 1.1;

        # ttyd streams the terminal over WebSocket.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Terminal sessions are long-lived; don't cut them at the default 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
